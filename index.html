<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1420"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f1420'/%3E%3Ctext x='50' y='66' font-size='56' text-anchor='middle'%3E%E2%AD%90%3C/text%3E%3C/svg%3E">
<title>Watchlist</title>
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#0f1420;--card:#1a2233;--text:#f2f5fa;--muted:#9aa6b8;--accent:#5bc8c0;--heart:#ff6b81}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 90px}
h1{font-size:22px;margin:4px 0 12px}
.who{display:flex;gap:8px;margin-bottom:12px}
.who button{flex:1;padding:10px;border-radius:12px;border:1px solid #2b3650;background:var(--card);color:var(--muted);font-size:15px}
.who button.on{background:var(--accent);color:#062623;border-color:var(--accent);font-weight:700}
input[type=search]{width:100%;padding:14px;border-radius:14px;border:1px solid #2b3650;background:var(--card);color:var(--text);font-size:17px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:10px;margin-top:10px}
.row img,.ph{width:56px;height:84px;border-radius:8px;object-fit:cover;background:#26304a;flex:none}
.row .t{flex:1;min-width:0}.row b{display:block}.row small{color:var(--muted)}
.btn{border:0;border-radius:999px;padding:9px 16px;font-size:15px;font-weight:700;background:var(--accent);color:#062623}
.btn.ghost{background:#26304a;color:var(--text)}
.heart{border:0;background:none;font-size:26px;color:var(--muted)}.heart.on{color:var(--heart)}
h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 0}
.badge{display:inline-block;background:#26304a;border-radius:999px;padding:2px 8px;font-size:12px;margin:4px 4px 0 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #2b3650;background:var(--card);color:var(--muted);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--text);color:#0f1420;border-color:var(--text);font-weight:700}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 0;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.sug{flex:none;width:112px}.sug img,.sug .ph{width:112px;height:168px;border-radius:10px;object-fit:cover;background:#26304a;display:block}
.sug b{display:block;font-size:13px;margin-top:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sug .btn{width:100%;margin-top:4px;padding:6px 0;font-size:13px}
h3{font-size:15px;margin:16px 0 0}
#msg{position:fixed;left:16px;right:16px;bottom:20px;background:#26304a;border-radius:12px;padding:12px;text-align:center;opacity:0;transition:.25s;pointer-events:none}
#msg.show{opacity:1}

.tabs{display:flex;gap:6px;margin:0 0 14px;background:var(--card);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px 0;border-radius:11px;font-size:15px;font-weight:600}
.tabs button.on{background:#26304a;color:var(--text)}
.deck{position:relative;height:min(68vh,560px);margin-top:6px;touch-action:pan-y}
.sw{position:absolute;inset:0;border-radius:20px;overflow:hidden;background:var(--card);box-shadow:0 8px 28px #0008;transition:transform .25s,opacity .25s;user-select:none}
.sw img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.sw .info{position:absolute;left:0;right:0;bottom:0;padding:60px 16px 16px;background:linear-gradient(transparent,#000d 60%)}
.sw .info b{font-size:22px;display:block}.sw .info small{color:#cdd5e2;display:block;margin-top:2px}
.sw .info p{margin:8px 0 0;font-size:13px;color:#cdd5e2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stamp{position:absolute;top:22px;padding:4px 14px;border:3px solid;border-radius:10px;font-weight:800;font-size:26px;opacity:0;transform:rotate(-8deg)}
.stamp.want{left:18px;color:#5bf0a0;border-color:#5bf0a0}.stamp.skip{right:18px;color:#ff6b81;border-color:#ff6b81;transform:rotate(8deg)}
.acts{display:flex;justify-content:center;gap:28px;margin-top:16px}
.acts button{width:68px;height:68px;border-radius:50%;border:2px solid #2b3650;background:var(--card);font-size:28px}
.acts .no{color:#ff6b81}.acts .yes{color:#5bf0a0}
.match{position:fixed;inset:0;background:#0f1420ee;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;z-index:5}
.match.show{display:flex}.match h2{font-size:30px;color:var(--text);text-transform:none;letter-spacing:0;margin:0 0 6px}.match img{width:150px;border-radius:12px;margin:14px 0}
.big{width:100%;padding:16px;font-size:18px;margin-top:14px}
.pick{margin-top:16px;background:var(--card);border-radius:18px;overflow:hidden}.pick img{width:100%;max-height:420px;object-fit:cover;display:block}
.pick .body{padding:14px}.pick h3{margin:0;font-size:22px}.pick p{color:#cdd5e2;font-size:14px}
.sw{touch-action:none}
.acts{gap:18px;align-items:flex-start}.acts div{text-align:center;color:var(--muted);font-size:12px}.acts div button{display:block;margin:0 auto 4px}
.acts .mid{color:var(--muted);font-size:24px;width:56px;height:56px;margin-top:6px}
.pill{position:absolute;right:12px;top:12px;border:0;border-radius:999px;background:#000a;color:#fff;padding:8px 14px;font-size:14px;font-weight:700;z-index:2}
.sheet{position:fixed;inset:0;background:#0f1420f2;overflow-y:auto;display:none;z-index:6;padding:max(16px,env(safe-area-inset-top)) 16px 40px}
.sheet.show{display:block}.sheet .x{position:sticky;top:0;float:right;border:0;background:#26304a;color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;z-index:2}
.sheet h2{font-size:26px;text-transform:none;letter-spacing:0;color:var(--text);margin:6px 0 2px}.sheet .meta{color:var(--muted);font-size:14px}
.sheet .tag{font-style:italic;color:#cdd5e2;margin:10px 0 0}.sheet p{color:#e3e8f1;font-size:15px}
.vid{position:relative;padding-top:56.25%;margin:14px 0;border-radius:14px;overflow:hidden;background:#000}.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.row[data-ix]{cursor:pointer}
</style></head><body>
<h1>⭐ Our Watchlist</h1>
<div class="who" id="who"></div>
<div class="tabs" id="tabs"><button data-t="list" class="on">List</button><button data-t="swipe">Swipe</button><button data-t="tonight">Tonight</button></div>
<div id="tab-swipe" style="display:none"><div class="deck" id="deck"></div><div class="acts"><div><button class="no" id="noBtn" aria-label="No">✕</button>No</div><div><button class="mid" id="midBtn" aria-label="Skip for now">⏭</button>Skip</div><div><button class="yes" id="yesBtn" aria-label="Want">♥</button>Want</div></div>
<p style="text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0">Swipe right = want \u00b7 left = no thanks \u00b7 up = skip for now \u00b7 tap = trailer and details</p></div>
<div id="tab-tonight" style="display:none"><div class="chips" id="tkind"></div><button class="btn big" id="pickBtn">What should we watch?</button><div id="pickOut"></div></div>
<div id="tab-list">
<input type="search" id="q" placeholder="Search a show or movie to add…" autocomplete="off">
<div id="results"></div>
<h2>On the list</h2>
<div class="chips" id="types"></div>
<div class="chips" id="genres"></div>
<div id="list"></div>
<h2>Suggested for you</h2>
<div id="sugs"><p style="color:var(--muted)">Finding ideas…</p></div>
</div>
<div class="match" id="match"></div>
<div class="sheet" id="sheet"></div>
<div id="msg"></div>
<script>
const API = 'https://jwbzbxzgpkdyabysjmbj.supabase.co/functions/v1/watchlist';
const params = new URLSearchParams(location.hash.slice(1) || location.search);
if (params.get('k')) { localStorage.setItem('wl_k', params.get('k')); history.replaceState(null, '', location.pathname); }
const K = localStorage.getItem('wl_k') || '';
let me = localStorage.getItem('wl_me') || '';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){ const m=$('msg'); m.textContent=t; m.classList.add('show'); setTimeout(()=>m.classList.remove('show'),1800); }
async function call(action, body){
  const opts = { headers: { 'x-app-token': K, 'Content-Type': 'application/json' } };
  let url = API;
  if (body) { opts.method='POST'; opts.body=JSON.stringify({ action, ...body }); } else { url += '?action=' + action; }
  const r = await fetch(url, opts); return r.json();
}
function drawWho(){
  $('who').innerHTML = ['Andy','Brittany'].map(n=>'<button class="'+(me===n?'on':'')+'" data-n="'+n+'">'+n+'</button>').join('');
  $('who').querySelectorAll('button').forEach(b=>b.onclick=()=>{ me=b.dataset.n; localStorage.setItem('wl_me',me); drawWho(); drawList(); if(tab==='swipe') loadDeck(); });
}
let items = [], type = 'all', genre = '', lastShown = [];
function drawChips(){
  const T = [['all','All'],['movie','Movies'],['tv','Shows']];
  $('types').innerHTML = T.map(([k,l])=>'<button class="chip '+(type===k?'on':'')+'" data-k="'+k+'">'+l+'</button>').join('');
  $('types').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ type=b.dataset.k; genre=''; drawChips(); drawList(); });
  const pool = items.filter(i=>type==='all'||i.media_type===type);
  const gs = [...new Set(pool.flatMap(i=>i.genres||[]))].sort();
  $('genres').innerHTML = gs.length ? ['',...gs].map(g=>'<button class="chip '+(genre===g?'on':'')+'" data-g="'+esc(g)+'">'+(g||'Any genre')+'</button>').join('') : '';
  $('genres').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ genre=b.dataset.g; drawChips(); drawList(); });
}
function drawList(){
  const shown = lastShown = items.filter(i=>(type==='all'||i.media_type===type)&&(!genre||(i.genres||[]).includes(genre)));
  $('list').innerHTML = shown.length ? shown.map((i,ix)=>'<div class="row" data-ix="'+ix+'">'+(i.poster?'<img src="'+i.poster+'">':'<div class="ph"></div>')+
    '<div class="t"><b>'+esc(i.title)+'</b><small>'+esc(i.year)+' \u00b7 '+(i.media_type==='tv'?'Show':'Movie')+' \u00b7 added by '+esc(i.added_by)+'</small><div>'+
    (i.genres||[]).slice(0,2).map(g=>'<span class="badge">'+esc(g)+'</span>').join('')+(i.providers||[]).map(p=>'<span class="badge" style="background:#1f4d49">'+esc(p)+'</span>').join('')+'</div></div>'+
    '<button class="heart '+(i.hearts.includes(me)?'on':'')+'" data-id="'+i.id+'">'+(i.hearts.includes(me)?'\u2665':'\u2661')+' <small>'+i.hearts.length+'</small></button></div>').join('') : '<p style="color:var(--muted)">'+(items.length?'Nothing matches that filter.':'Nothing yet. Search above or add from the suggestions below.')+'</p>';
  $('list').querySelectorAll('.row[data-ix]').forEach(r=>r.onclick=e=>{ if(e.target.closest('.heart')) return; openDetails(lastShown[+r.dataset.ix],false); });
  $('list').querySelectorAll('.heart').forEach(b=>b.onclick=async()=>{ if(!me) return toast('Pick Andy or Brittany first'); await call('heart',{id:+b.dataset.id,who:me}); load(); });
}
let sugRows = [];
function drawSugs(){
  const t = type;
  const rows = sugRows.map(r=>({label:r.label,items:r.items.filter(x=>t==='all'||x.media_type===t)})).filter(r=>r.items.length);
  $('sugs').innerHTML = rows.length ? rows.map((r,ri)=>'<h3>'+esc(r.label)+'</h3><div class="strip">'+r.items.map((x,xi)=>'<div class="sug">'+(x.poster?'<img src="'+x.poster+'">':'<div class="ph"></div>')+'<b>'+esc(x.title)+'</b><button class="btn" data-r="'+ri+'" data-x="'+xi+'">+ Add</button></div>').join('')+'</div>').join('') : '<p style="color:var(--muted)">No suggestions right now.</p>';
  $('sugs').querySelectorAll('.btn').forEach(b=>b.onclick=async()=>{ if(!me) return toast('Pick Andy or Brittany first'); const x=rows[+b.dataset.r].items[+b.dataset.x]; b.disabled=true; b.textContent='Added'; await call('add',{tmdb_id:x.tmdb_id,media_type:x.media_type,by:me}); toast('Added '+x.title); load(); });
}
async function loadSugs(){ const r = await call('suggest'); sugRows = r.rows||[]; drawSugs(); }
async function load(){ const r = await call('list'); if (r.error) { $('list').innerHTML='<p style="color:var(--muted)">Cannot load the list ('+esc(r.error)+'). Open the link Claude gave you again.</p>'; return; } items=r.items; drawChips(); drawList(); }
let timer; $('q').oninput = () => { clearTimeout(timer); timer = setTimeout(async () => {
  const q = $('q').value.trim(); if (q.length<2) { $('results').innerHTML=''; return; }
  const r = await call('search&q='+encodeURIComponent(q)); const res = r.results||[];
  $('results').innerHTML = res.map((x,i)=>'<div class="row">'+(x.poster?'<img src="'+x.poster+'">':'<div class="ph"></div>')+'<div class="t"><b>'+esc(x.title)+'</b><small>'+esc(x.year)+' · '+(x.media_type==='tv'?'Show':'Movie')+'</small></div><button class="btn" data-i="'+i+'">Add</button></div>').join('');
  $('results').querySelectorAll('.btn').forEach(b=>b.onclick=async()=>{ if(!me) return toast('Pick Andy or Brittany first'); const x=res[+b.dataset.i]; b.disabled=true; const a=await call('add',{tmdb_id:x.tmdb_id,media_type:x.media_type,by:me}); toast(a.status==='exists'?'Already on the list':'Added '+x.title); $('q').value=''; $('results').innerHTML=''; load(); loadSugs(); });
}, 350); };


// ---- details + trailer
async function openDetails(c,play){
  const sh=$('sheet'); sh.classList.add('show'); document.body.style.overflow='hidden';
  sh.innerHTML='<button class="x" id="sx">\u2715</button><p style="color:var(--muted)">Loading\u2026</p>'; $('sx').onclick=closeDetails;
  const d=await call('details&media_type='+c.media_type+'&tmdb_id='+c.tmdb_id).catch(()=>({}));
  if(d.error||!d.title){ sh.innerHTML='<button class="x" id="sx">\u2715</button><p style="color:var(--muted)">Cannot load details right now.</p>'; $('sx').onclick=closeDetails; return; }
  const bits=[d.year,d.media_type==='tv'?'Show'+(d.seasons?' \u00b7 '+d.seasons+' season'+(d.seasons>1?'s':''):''):'Movie',d.minutes?(d.media_type==='tv'?d.minutes+' min/ep':Math.floor(d.minutes/60)+'h '+d.minutes%60+'m'):'',d.rating?'\u2605 '+d.rating:''].filter(Boolean);
  sh.innerHTML='<button class="x" id="sx">\u2715</button><h2>'+esc(d.title)+'</h2><div class="meta">'+esc(bits.join(' \u00b7 '))+'</div>'+
    (d.trailer?'<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/'+encodeURIComponent(d.trailer)+'?rel=0&playsinline=1'+(play?'&autoplay=1':'')+'" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div><a href="https://www.youtube.com/watch?v='+encodeURIComponent(d.trailer)+'" target="_blank" rel="noopener" style="color:var(--accent);font-size:13px">Open on YouTube</a>':'<p style="color:var(--muted)">No trailer found for this one.</p>')+
    (d.tagline?'<p class="tag">'+esc(d.tagline)+'</p>':'')+'<p>'+esc(d.overview||'No description yet.')+'</p><div>'+(d.genres||[]).map(g=>'<span class="badge">'+esc(g)+'</span>').join('')+(d.providers||[]).map(p=>'<span class="badge" style="background:#1f4d49">'+esc(p)+'</span>').join('')+'</div>';
  $('sx').onclick=closeDetails;
}
function closeDetails(){ const sh=$('sheet'); sh.classList.remove('show'); sh.innerHTML=''; document.body.style.overflow=''; }
// ---- tabs
let tab='list';
function showTab(t){ tab=t; ['list','swipe','tonight'].forEach(k=>$('tab-'+k).style.display=k===t?'':'none');
  $('tabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='swipe') loadDeck(); if(t==='tonight') drawTonight(); }
$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
// ---- swipe
let deck=[], deckFor='';
async function loadDeck(){
  if(!me){ $('deck').innerHTML='<p style="color:var(--muted)">Pick Andy or Brittany above first.</p>'; return; }
  if(deckFor===me && deck.length) return drawDeck();
  $('deck').innerHTML='<p style="color:var(--muted)">Finding things to swipe\u2026</p>';
  const r=await call('deck&who='+encodeURIComponent(me)); deck=r.cards||[]; deckFor=me; drawDeck();
}
function drawDeck(){
  const c=deck[0];
  if(!c){ $('deck').innerHTML='<p style="color:var(--muted)">That is everything for now. Check back later for new ideas.</p>'; return; }
  const who=(c.wanted_by||[]).filter(n=>n!==me);
  const note=c.source==='list'?(who.length?esc(who.join(' and '))+' wants this':'On our list'):esc(c.reason||'Suggested');
  $('deck').innerHTML='<div class="sw" id="top">'+(c.poster?'<img src="'+c.poster+'">':'')+'<button class="pill" id="trl">\u25b6 Trailer</button><div class="stamp want">WANT</div><div class="stamp skip">NO</div><div class="info"><b>'+esc(c.title)+'</b><small>'+esc(c.year)+' \u00b7 '+(c.media_type==='tv'?'Show':'Movie')+' \u00b7 '+note+'</small><p>'+esc(c.overview||'')+'</p></div></div>';
  const el=$('top'); let x0=null,y0=0,dx=0,dy=0;
  $('trl').onpointerdown=e=>e.stopPropagation(); $('trl').onclick=()=>openDetails(c,true);
  el.onpointerdown=e=>{ x0=e.clientX; y0=e.clientY; dx=dy=0; el.setPointerCapture(e.pointerId); el.style.transition='none'; };
  el.onpointermove=e=>{ if(x0===null) return; dx=e.clientX-x0; dy=e.clientY-y0; el.style.transform='translate('+dx+'px,'+Math.min(dy,0)+'px) rotate('+dx/18+'deg)';
    el.querySelector('.want').style.opacity=Math.max(0,Math.min(1,dx/90)); el.querySelector('.skip').style.opacity=Math.max(0,Math.min(1,-dx/90)); };
  el.onpointerup=()=>{ if(x0===null) return; x0=null; el.style.transition='';
    if(Math.abs(dx)<8&&Math.abs(dy)<8){ el.style.transform=''; openDetails(c,false); }
    else if(dx>90) vote('want'); else if(dx<-90) vote('skip'); else if(dy<-110) later();
    else { el.style.transform=''; el.querySelectorAll('.stamp').forEach(s=>s.style.opacity=0); } dx=dy=0; };
}
// Skip for now: no opinion, so nothing is saved and the title goes to the back of the deck.
function later(){ const c=deck.shift(); if(!c) return; const el=$('top'); if(el){ el.style.transition='transform .25s,opacity .25s'; el.style.transform='translateY(-120vh)'; el.style.opacity=0; } deck.push(c); setTimeout(drawDeck,230); }
let voting=false;
async function vote(v){
  const c=deck[0]; if(!c||voting) return; voting=true;
  const el=$('top'); if(el){ el.style.transition='transform .25s,opacity .25s'; el.style.transform='translateX('+(v==='want'?'':'-')+'120vw) rotate('+(v==='want'?18:-18)+'deg)'; el.style.opacity=0; }
  deck.shift();
  const p=call('swipe',{who:me,tmdb_id:c.tmdb_id,media_type:c.media_type,vote:v});
  setTimeout(drawDeck,230);
  const r=await p.catch(()=>({})); voting=false;
  if(v==='want'){ load(); if(r.match) showMatch(c); }
}
function showMatch(c){ const m=$('match'); m.innerHTML='<h2>\ud83c\udf89 You both want this!</h2>'+(c.poster?'<img src="'+c.poster+'">':'')+'<b style="font-size:20px">'+esc(c.title)+'</b><button class="btn big" id="mok">Keep swiping</button>'; m.classList.add('show'); $('mok').onclick=()=>m.classList.remove('show'); }
$('noBtn').onclick=()=>vote('skip'); $('midBtn').onclick=later; $('yesBtn').onclick=()=>vote('want');
// ---- tonight
let tkind='any', skipIds=[];
function drawTonight(){
  const T=[['any','Anything'],['movie','Movie'],['tv','Show']];
  $('tkind').innerHTML=T.map(([k,l])=>'<button class="chip '+(tkind===k?'on':'')+'" data-k="'+k+'">'+l+'</button>').join('');
  $('tkind').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ tkind=b.dataset.k; skipIds=[]; drawTonight(); });
}
async function pickTonight(){
  $('pickOut').innerHTML='<p style="color:var(--muted)">Picking\u2026</p>';
  const r=await call('tonight&type='+tkind+'&skip='+skipIds.join(',')); const i=r.item;
  if(!i){ $('pickOut').innerHTML='<p style="color:var(--muted)">'+(skipIds.length?'That is all of them. Tap again to start over.':'Nothing to pick from yet. Swipe a few titles first.')+'</p>'; skipIds=[]; return; }
  const both=i.hearts.includes('Andy')&&i.hearts.includes('Brittany');
  $('pickOut').innerHTML='<div class="pick">'+(i.poster?'<img src="'+i.poster+'">':'')+'<div class="body"><h3>'+esc(i.title)+'</h3><small style="color:var(--muted)">'+esc(i.year)+' \u00b7 '+(i.media_type==='tv'?'Show':'Movie')+(both?' \u00b7 you both want this':'')+'</small><div>'+(i.providers||[]).map(p=>'<span class="badge" style="background:#1f4d49">'+esc(p)+'</span>').join('')+'</div><p>'+esc(i.overview||'')+'</p><button class="btn ghost big" id="nope">Not this one</button></div></div>';
  $('nope').onclick=()=>{ skipIds.push(i.id); pickTonight(); };
}
$('pickBtn').onclick=()=>{ skipIds=[]; pickTonight(); };

drawWho(); load(); loadSugs();
</script></body></html>
